<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알려줄게!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #f1f5f9; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .loading-shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .rotate-anim { animation: rotation 0.6s linear; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-20 relative">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-2 tracking-tight">알려줄게!</h1>
            <p class="text-slate-500 text-lg">검색어를 입력하면 6가지 관점에서 아주 상세하고 풍성한 정보를 요약해 드립니다.</p>
        </header>

        <div class="max-w-3xl mx-auto mb-12">
            <div class="relative group">
                <input type="text" id="search-input" class="w-full pl-6 pr-32 py-5 bg-white border border-slate-200 rounded-3xl shadow-xl focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all text-lg font-medium" placeholder="검색어를 입력하세요">
                <button id="search-btn" class="absolute right-3 top-2.5 bottom-2.5 px-6 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl transition-all shadow-lg">검색</button>
            </div>
            
            <div class="flex items-center justify-center gap-2 mt-6">
                <div id="tags-container" class="flex flex-wrap justify-center gap-2 max-w-2xl"></div>
                <button id="refresh-btn" class="p-2 text-slate-400 hover:text-blue-500 rounded-full transition-all border border-slate-200 bg-white">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div id="loading-area" class="hidden max-w-6xl mx-auto space-y-6 mb-12">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="h-60 loading-shimmer rounded-3xl"></div><div class="h-60 loading-shimmer rounded-3xl"></div><div class="h-60 loading-shimmer rounded-3xl"></div>
                <div class="h-60 loading-shimmer rounded-3xl"></div><div class="h-60 loading-shimmer rounded-3xl"></div><div class="h-60 loading-shimmer rounded-3xl"></div>
            </div>
        </div>

        <div id="result-area" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto"></div>
    </div>

    <script>
        const apiKey = ""; 
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const loadingArea = document.getElementById('loading-area');
        const resultArea = document.getElementById('result-area');
        const tagsContainer = document.getElementById('tags-container');

        let conversationHistory = [];

        async function fetchKnowledge(query) {
            loadingArea.classList.remove('hidden');
            resultArea.innerHTML = '';
            conversationHistory.push({ role: "user", parts: [{ text: query }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: conversationHistory,
                        tools: [{ "google_search": {} }],
                        systemInstruction: { parts: [{ text: '당신은 정보 요약 전문가입니다. 6가지 관점에서 각 항목당 5~6문장으로 아주 상세하고 풍성하게 설명하세요. JSON(sections, relatedTags) 형식으로 리턴하세요.' }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) throw new Error('API 오류');
                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);
                
                conversationHistory.push({ role: "model", parts: [{ text: JSON.stringify(result) }] });
                loadingArea.classList.add('hidden');
                displayResults(result);
            } catch (e) {
                loadingArea.classList.add('hidden');
                resultArea.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">정보를 불러오지 못했습니다.</div>`;
            }
        }

        function displayResults(data) {
            const colorMap = {
                blue: 'bg-blue-50 text-blue-600', rose: 'bg-rose-50 text-rose-600', amber: 'bg-amber-50 text-amber-600',
                emerald: 'bg-emerald-50 text-emerald-600', violet: 'bg-violet-50 text-violet-600', orange: 'bg-orange-50 text-orange-600'
            };

            resultArea.innerHTML = data.sections.map((s, i) => {
                const theme = colorMap[s.theme] || colorMap.blue;
                return `
                    <div class="glass-card rounded-3xl p-6 shadow-md fade-in border" style="animation-delay: ${i * 0.05}s">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="p-2 rounded-xl ${theme}"><i data-lucide="${s.icon}"></i></div>
                            <h3 class="font-bold text-lg">${s.title}</h3>
                        </div>
                        <ul class="space-y-2 text-sm text-slate-700">${s.items.map(item => `<li>• ${item}</li>`).join('')}</ul>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function refreshDefaultTags() {
            const icon = refreshBtn.querySelector('i');
            if (icon) {
                icon.classList.add('rotate-anim');
                setTimeout(() => icon.classList.remove('rotate-anim'), 600);
            }

            const tags = ['스팀 인기게임', '리그오브레전드 메타', '닌텐도 스위치 명작', '최신 모바일 게임', '인디 게임 추천', 'FPS 게임 공략', '자존감', '경제 기초', '생활 꿀팁', '우주 과학'];
            const shuffled = tags.sort(() => 0.5 - Math.random());
            
            tagsContainer.innerHTML = `<span class="text-sm font-black text-blue-700 mr-3">추천 검색어</span>` + 
                shuffled.slice(0, 8).map(t => `<button onclick="quickSearch('${t}')" class="px-4 py-2 border rounded-full text-sm font-medium hover:bg-blue-100">${t}</button>`).join('');
        }

        function quickSearch(t) { searchInput.value = t; fetchKnowledge(t); }
        searchBtn.addEventListener('click', () => fetchKnowledge(searchInput.value));
        refreshBtn.addEventListener('click', refreshDefaultTags);
        
        window.addEventListener('load', () => {
            lucide.createIcons();
            refreshDefaultTags();
        });
    </script>
</body>
</html>
